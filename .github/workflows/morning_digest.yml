name: Daily Finance Morning Digest

on:
  # Không dùng lịch 'schedule' của GitHub nữa (hay chạy trễ).
  # Lịch 7h sáng được cron-job.org gọi qua workflow_dispatch.
  workflow_dispatch: {} # Cho phép bấm Run workflow thủ công hoặc qua API

permissions:
  contents: read

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 trafilatura python-docx google-genai yfinance

      - name: Run daily finance digest script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python daily_finance_docx.py
